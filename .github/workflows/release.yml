name: Android Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - 'core/**'
      - 'feature/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # The setup-gradle action automatically configures caching for Gradle User Home
          # and project-specific cache.
          cache-read-only: false # Allow writing to the cache

      - name: Run Lint
        run: ./gradlew lintRelease

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo $KEYSTORE_BASE64 | base64 --decode > keystore_release.jks
          else
            echo "KEYSTORE_BASE64 secret not found. Skipping keystore generation."
          fi

      - name: Calculate Source Hash
        id: source-hash
        run: |
          echo "hash=${{ hashFiles('app/src/**', 'core/**', 'feature/**', 'gradle/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties') }}" >> $GITHUB_OUTPUT

      - name: Cache Release Artifacts
        id: cache-release
        uses: actions/cache@v4
        with:
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          key: release-artifacts-${{ steps.source-hash.outputs.hash }}

      - name: Extract Version
        id: extract_version
        run: |
          # Extract version from tag (e.g., v1.0.0 -> 1.0.0)
          VERSION_NAME=${GITHUB_REF#refs/tags/v}
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build Release
        if: steps.cache-release.outputs.cache-hit != 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/keystore_release.jks
        run: |
          ./gradlew bundleRelease assembleRelease \
            -DBUILD_VERSION=${{ env.VERSION_NAME }} \
            -DBUILD_NUMBER=${{ env.BUILD_NUMBER }}

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Release Bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: app/build/outputs/bundle/release

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
