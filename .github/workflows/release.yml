name: Android Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - 'core/**'
      - 'feature/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g., 1.0.0)'
        required: false
        default: '0.0.1-snapshot'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # The setup-gradle action automatically configures caching for Gradle User Home
          # and project-specific cache.
          cache-read-only: false # Allow writing to the cache

      - name: Run Lint
        # Exclude unit tests when building in release mode
        run: ./gradlew lintRelease -x testReleaseUnitTest

  build:
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.extract_version.outputs.version_name }}
      is_tagged: ${{ steps.extract_version.outputs.is_tagged }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo $KEYSTORE_BASE64 | base64 --decode > keystore_release.jks
          else
            echo "KEYSTORE_BASE64 secret not found. Skipping keystore generation."
          fi

      - name: Calculate Source Hash
        id: source-hash
        run: |
          echo "hash=${{ hashFiles('app/src/**', 'core/**', 'feature/**', 'gradle/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties') }}" >> $GITHUB_OUTPUT

      - name: Cache Release Artifacts
        id: cache-release
        uses: actions/cache@v4
        with:
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          key: release-artifacts-${{ steps.source-hash.outputs.hash }}

      - name: Extract Version
        id: extract_version
        run: |
          IS_TAGGED="false"
          VERSION_NAME="0.0.1-snapshot"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION_NAME="${{ inputs.version_name }}"
            if [ -z "$VERSION_NAME" ]; then
               VERSION_NAME="0.0.1-snapshot"
            fi
            # Treat manual trigger as a "tagged" release if user wants (optional)
            # but usually manual is for specific testing. 
            # We will rely on user input version.
          elif [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
             # Triggered by tag push
             VERSION_NAME=${GITHUB_REF#refs/tags/v}
             IS_TAGGED="true"
          else
             # Triggered by branch push, check if current HEAD has a tag
             if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
               TAG=$(git describe --tags --exact-match HEAD)
               VERSION_NAME=${TAG#v}
               IS_TAGGED="true"
               echo "Found tag on HEAD: $TAG"
             else
               echo "No tag found on HEAD"
             fi
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "is_tagged=$IS_TAGGED" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build Release
        if: steps.cache-release.outputs.cache-hit != 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/keystore_release.jks
        run: |
          ./gradlew bundleRelease assembleRelease \
            -DBUILD_VERSION=${{ env.VERSION_NAME }} \
            -DBUILD_NUMBER=${{ env.BUILD_NUMBER }}

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

  release:
    needs: build
    if: needs.build.outputs.is_tagged == 'true' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Release Bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: app/build/outputs/bundle/release

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
